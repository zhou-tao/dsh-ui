name: Release

# 触发：推送 v* 标签（如 v0.1.0）
# 产物：
#   - TUI 发布到 npm（需 NPM_TOKEN，@dsh-ui scope 的 publish 权限）
#   - 桌面端 GitHub Release：macOS(Apple Silicon .dmg / Intel .dmg) + Windows(.msi/.exe)
#   - VS Code 扩展发布（需 VSCE_PAT；未配置 token 时自动跳过）
#   - H5 静态包 + 插件 bundle 附加到 Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:        # 手动重跑 release 构建（如 CI 因基础设施故障失败后重试）

permissions:
  contents: write           # 创建/更新 GitHub Release 与附件必需（默认 token 为只读）

jobs:
  # ---------- TUI：发布 npm 包 ----------
  tui-publish:
    name: Publish TUI to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm (version 取自 package.json 的 packageManager)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (turbo：protocol → tui)
        run: pnpm build

      - name: Publish @dsh-ui/tui (无 NPM_TOKEN 时跳过)
        if: env.NPM_TOKEN != ''
        run: pnpm --filter @dsh-ui/tui publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ---------- VS Code 扩展：打包 + 发布（无 VSCE_PAT 时跳过发布） ----------
  vscode-publish:
    name: Publish VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm (version 取自 package.json 的 packageManager)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build protocol + extension
        run: |
          pnpm --filter @dsh-ui/protocol build
          pnpm --filter dsh-ui-extension build

      - name: Bundle webview (inline @dsh-ui/protocol，vsix 自包含)
        run: |
          ESB=$(ls node_modules/.pnpm/esbuild@*/node_modules/esbuild/bin/esbuild 2>/dev/null | head -1)
          if [ -z "$ESB" ]; then echo "::error::esbuild not found in pnpm store"; exit 1; fi
          (cd apps/vscode-extension && "$OLDPWD/$ESB" out/webview.js --bundle --format=cjs --platform=node --external:vscode --outfile=out/webview.js --allow-overwrite)

      - name: Package .vsix (--no-dependencies 规避 pnpm workspace 的 npm list 问题)
        run: |
          mkdir -p artifacts
          (cd apps/vscode-extension && npx @vscode/vsce package --no-dependencies --out ../../artifacts/dsh-ui-extension-${{ github.ref_name }}.vsix)

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath artifacts/dsh-ui-extension-${{ github.ref_name }}.vsix


  # ---------- TUI：独立可执行文件（bun compile，免装 node） ----------
  tui-binaries:
    name: TUI binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: bun-darwin-arm64
            out: dsh-tui-macos-arm64
          - os: macos-13
            target: bun-darwin-x64
            out: dsh-tui-macos-x64
          - os: windows-latest
            target: bun-windows-x64
            out: dsh-tui-windows-x64.exe
          - os: ubuntu-latest
            target: bun-linux-x64
            out: dsh-tui-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Build protocol (bun 解析 @dsh-ui/protocol 的 dist 产物)
        run: pnpm --filter @dsh-ui/protocol build

      - name: Build standalone executable
        run: |
          mkdir -p artifacts
          (cd apps/tui && bun build --compile ./src/index.tsx --target ${{ matrix.target }} --outfile ../../artifacts/${{ matrix.out }})

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/${{ matrix.out }}

  # ---------- 桌面端：GitHub Release（macOS arm64 / macOS x64 / Windows x64） ----------
  desktop-release:
    name: Desktop ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14      # Apple Silicon
          - platform: macos-13      # Intel
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm (version 取自 package.json 的 packageManager)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          releaseBody: |
            ## DeepSeek Harness UI

            桌面客户端（Tauri 2）+ 手机互联（同一 Wi-Fi 局域网扫码）。

            - **macOS**：Apple Silicon（arm64）与 Intel（x86_64）各一个 `.dmg`
            - **Windows**：`.msi` 与 `.exe`（NSIS 安装包）
            - **VS Code 扩展**：`dsh-ui-extension-<tag>.vsix`（Marketplace 或手动安装）
            - **H5 手机页**：`mobile-h5-dist.tar.gz`（解压后由桥接服务托管）
            - **TUI**：`dsh-tui-macos-arm64` / `dsh-tui-macos-x64` / `dsh-tui-windows-x64.exe` / `dsh-tui-linux-x64`（独立可执行文件，免装 node；npm 用户也可 `npm i -g @dsh-ui/tui`）
            - **插件**：`dsh-deep-ui.tgz` / `dsh-remote.tgz`（`pnpm plugins:install` 安装）
            - 未签名构建：macOS 首次打开请右键 → 打开；Windows 见 SmartScreen 提示
            - 需要本机已安装 `dsh`（`npm i -g @deepseek-ai/dsh`）或 harness 已在 127.0.0.1:3080 运行

  # ---------- 附加资产：H5 静态包 + 插件 bundle（附加到同一 Release） ----------
  web-assets:
    name: Build & attach H5 / plugins assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm (version 取自 package.json 的 packageManager)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (turbo：protocol → mobile-h5)
        run: pnpm build

      - name: Archive H5 dist
        run: (cd apps/mobile-h5 && tar -czf /tmp/mobile-h5-dist.tar.gz dist)

      - name: Package plugins
        run: |
          mkdir -p /tmp/dist-plugins
          for d in plugins/*/; do
            name=$(basename "$d")
            tar --exclude=node_modules -czf "/tmp/dist-plugins/$name.tgz" -C "$d" .
          done

      - name: Attach assets to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            /tmp/mobile-h5-dist.tar.gz
            /tmp/dist-plugins/*.tgz
